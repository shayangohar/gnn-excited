# TASK-291 E1: uma_qm9gwbse_richind_he_heads_s17.yaml with seed 19 (heavy-element TD-DFT aux, separate heads; KNOW-289).
# Production-candidate member; compare with uma_qm9gwbse_richind_s19.
model:
  checkpoint_path: checkpoints/uma/checkpoints/uma-s-1p2p1.pt
  head_hidden: 256
  readout: rich
  readout_layers: 1
  lmax: 2
dataset:
  packed_path: data/processed/qm9gwbse/qm9gwbse_packed.npz
targets:
  columns:
  - S1_eV
  - log1p_S1_f
  - S2_eV
  - log1p_S2_f
  - S3_eV
  - log1p_S3_f
  - S4_eV
  - log1p_S4_f
  - S5_eV
  - log1p_S5_f
loss:
  type: qm9gwbse
  energy_weight: 1.0
  oscillator_weight: 1.0
  gap_weight: 0.1
  ordering_weight: 0.01
training:
  device: cuda
  seed: 19
  epochs: 40
  batch_size: 64
  backbone_lr: 0.0002
  head_lr: 0.001
  backbone_weight_decay: 0.0
  head_weight_decay: 0.001
  max_grad_norm: 1.0
  bf16: false
  mole_split_patch: true
  num_workers: 8
  max_hours: 18
  scheduler:
    warmup_epochs: 2
    start_factor: 0.01
    min_factor: 0.01
  checkpoint_path: checkpoints/uma_qm9gwbse_richind_he_heads_s19.pt
  metrics_csv_path: runs/uma_qm9gwbse_richind_he_heads_s19.metrics.csv
  summary_json_path: runs/uma_qm9gwbse_richind_he_heads_s19.summary.json
  checkpoint_metric: val_energy_eV_mae
  ema_decay: 0.999
  layer_lr_decay: 0.85
wandb:
  enabled: true
  entity: shayangohar2007-fresno-state
  project: gnn-excited
  name: uma_qm9gwbse_richind_he_heads_s19
  group: uma-wave-e
  tags:
  - QM9GWBSE
  - S1-S5
  - UMA-S
  - foundation-model
  - full-finetune
  - multi-fidelity
  - TASK-287
aux:
  packed_path: data/processed/pubchemqc_aux/heavy.npz
  columns: [S1_eV, S2_eV, S3_eV, S4_eV, S5_eV]
  mode: heads
  weight: 1.0
  batch_size: 32
post_inference:
  pool_path: data/processed/external_testsets/pool.npz
  out_csv: runs/head_to_head/ext_uma_richind_he_heads_s19.csv
