model:
  type: visnet
  hidden_channels: 128
  num_layers: 6
  num_rbf: 32
  cutoff: 5.0
  max_num_neighbors: 32

dataset:
  hdf5_path: data/final_all.hdf5
  manifest_path: data/processed/final_all_manifest_s5_dedup.csv
  split_path: data/processed/qcdge_audit/splits.csv
  split_column: random_split
  exclude_keys_path: data/processed/qm9gwbse/qcdge_pretrain_exclusions.csv
  local_copy: true
  report_subset_metrics: true
  split_seed: 17

targets:
  columns:
    - S1_eV
    - log1p_S1_f
    - S2_eV
    - log1p_S2_f
    - S3_eV
    - log1p_S3_f
    - S4_eV
    - log1p_S4_f
    - S5_eV
    - log1p_S5_f

loss:
  type: qm9gwbse
  energy_weight: 1.0
  oscillator_weight: 1.0
  gap_weight: 0.1
  ordering_weight: 0.01

training:
  device: cuda
  seed: 17
  epochs: 200
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  max_grad_norm: 1.0
  dataloader:
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  scheduler:
    type: reduce_on_plateau
    mode: min
    factor: 0.5
    patience: 8
    min_lr: 0.000001
  early_stopping_patience: 25
  early_stopping_min_delta: 0.00001
  checkpoint_path: checkpoints/visnet_final_all_s5_pretrain.pt
  metrics_csv_path: runs/visnet_final_all_s5_pretrain.metrics.csv
  summary_json_path: runs/visnet_final_all_s5_pretrain.summary.json

wandb:
  enabled: true
  entity: shayangohar2007-fresno-state
  project: gnn-excited
  name: visnet_final_all_s5_pretrain
  group: qcdge-qm9gwbse-transfer
  tags:
    - QCDGE-full
    - S1-S5
    - ViSNet
    - leakage-safe
    - pretraining
