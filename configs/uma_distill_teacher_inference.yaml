# TASK-257 B2: production UMA rich members (KNOW-256) predict the distillation pool.
model:
  checkpoint_path: checkpoints/uma/checkpoints/uma-s-1p2p1.pt
  head_hidden: 256
  readout: rich
  readout_layers: 1
  lmax: 2
dataset:
  packed_path: data/processed/qm9gwbse/qm9gwbse_packed.npz
targets:
  columns:
  - S1_eV
  - log1p_S1_f
  - S2_eV
  - log1p_S2_f
  - S3_eV
  - log1p_S3_f
  - S4_eV
  - log1p_S4_f
  - S5_eV
  - log1p_S5_f
loss:
  type: qm9gwbse
  energy_weight: 1.0
  oscillator_weight: 1.0
  gap_weight: 0.1
  ordering_weight: 0.01
training:
  device: cuda
  seed: 17
  epochs: 40
  batch_size: 64
  backbone_lr: 0.0002
  head_lr: 0.001
  backbone_weight_decay: 0.0
  head_weight_decay: 0.001
  max_grad_norm: 1.0
  bf16: false
  mole_split_patch: true
  num_workers: 8
  max_hours: 7.5
  scheduler:
    warmup_epochs: 2
    start_factor: 0.01
    min_factor: 0.01
  checkpoint_path: checkpoints/uma_eval_unused.pt
  metrics_csv_path: runs/distill/uma_inference.metrics.csv
  summary_json_path: runs/distill/uma_inference.summary.json
  head_init_seed: 17
  checkpoint_metric: val_energy_eV_mae
  ema_decay: 0.999
  layer_lr_decay: 0.85
wandb:
  enabled: false
  entity: shayangohar2007-fresno-state
  project: gnn-excited
  name: uma_qm9gwbse_rich_s17
  group: uma-wave-a
  tags:
  - QM9GWBSE
  - S1-S5
  - UMA-S
  - foundation-model
  - full-finetune
inference:
  pool_path: data/processed/distill/pool_pubchemqc.npz
  checkpoint_paths:
  - checkpoints/uma_qm9gwbse_rich_s17.pt
  - checkpoints/uma_qm9gwbse_rich_s18.pt
  - checkpoints/uma_qm9gwbse_rich_s19.pt
  out_csvs:
  - runs/distill/teacher_uma_rich_s17.csv
  - runs/distill/teacher_uma_rich_s18.csv
  - runs/distill/teacher_uma_rich_s19.csv
  batch_size: 128
