model:
  type: visnet
  hidden_channels: 216
  num_layers: 3
  num_rbf: 25
  cutoff: 5.0
  max_num_neighbors: 100
  reduce_op: mean

dataset:
  type: qmsymex
  hdf5_path: data/processed/qmsymex/train_st.h5
  manifest_path: data/processed/qmsymex/train_st_manifest.csv
  local_copy: true
  report_subset_metrics: false
  split_seed: 17
  train_fraction: 0.95
  val_fraction: 0.025

targets:
  columns:
    - S1_eV
    - S2_eV
    - S3_eV
    - S4_eV
    - S5_eV
    - T1_eV
    - T2_eV
    - T3_eV
    - T4_eV
    - T5_eV

loss:
  type: mse

training:
  device: cuda
  seed: 17
  epochs: 10
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.001
  max_grad_norm: 1.0
  skip_nonfinite_batches: true
  dataloader:
    num_workers: 12
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  scheduler:
    type: warmup_cosine
    warmup_epochs: 1
    start_factor: 0.0033333333333333335
    min_lr: 0.00001
  checkpoint_path: checkpoints/qmsymex_st_pretrain.pt
  metrics_csv_path: runs/qmsymex_st_pretrain.metrics.csv
  summary_json_path: runs/qmsymex_st_pretrain.summary.json

wandb:
  enabled: true
  entity: shayangohar2007-fresno-state
  project: gnn-excited
  name: qmsymex_st_pretrain
  group: qmsymex-transfer
  tags:
    - QM-symex
    - S1-S5
    - T1-T5
    - ViSNet
    - TD-DFT
    - pretrain
