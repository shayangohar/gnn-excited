model:
  type: visnet
  hidden_channels: 216
  num_layers: 3
  num_rbf: 25
  cutoff: 5.0
  max_num_neighbors: 100
  reduce_op: mean
  transition_refinement_sidecar: true
  num_states: 5
  dipole_reduce_op: sum

dataset:
  type: qm9gwbse
  hdf5_path: data/processed/qm9gwbse/qm9gwbse.h5
  manifest_path: data/processed/qm9gwbse/manifest.csv
  split_path: data/processed/qm9gwbse/splits.csv
  split_column: random_split
  local_copy: true
  split_seed: 17

targets:
  columns:
    - S1_eV
    - log1p_S1_f
    - S2_eV
    - log1p_S2_f
    - S3_eV
    - log1p_S3_f
    - S4_eV
    - log1p_S4_f
    - S5_eV
    - log1p_S5_f

loss:
  type: qm9gwbse
  energy_weight: 0.0
  oscillator_weight: 1.0
  dipole_weight: 0.1
  gap_weight: 0.0
  ordering_weight: 0.0

transfer:
  checkpoint_path: checkpoints/visnet_qm9gwbse_full_finetune.pt
  mode: frozen_sidecar

training:
  device: cuda
  seed: 17
  epochs: 50
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.001
  max_grad_norm: 1.0
  dataloader:
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  scheduler:
    type: warmup_cosine
    warmup_epochs: 5
    start_factor: 0.0033333333333333335
    min_lr: 0.00001
  checkpoint_path: checkpoints/visnet_qm9gwbse_transition_refinement_frozen.pt
  metrics_csv_path: runs/visnet_qm9gwbse_transition_refinement_frozen.metrics.csv
  summary_json_path: runs/visnet_qm9gwbse_transition_refinement_frozen.summary.json

wandb:
  enabled: true
  entity: shayangohar2007-fresno-state
  project: gnn-excited
  name: visnet_qm9gwbse_transition_refinement_frozen
  group: qm9gwbse-transition-refinement
  tags:
    - QM9GWBSE
    - S1-S5
    - ViSNet
    - qsGW-BSE
    - frozen-energy
    - transition-dipole
    - late-refinement
