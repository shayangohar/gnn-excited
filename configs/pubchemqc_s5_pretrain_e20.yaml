# TASK-244: pubchemqc_s5_pretrain.yaml for 20 epochs (the 10-epoch donor was still improving, KNOW-241)
# on data screened by scripts/screen_pubchemqc.py (KNOW-242). Logs keys of any batch with loss > 1.
model:
  type: visnet
  hidden_channels: 216
  num_layers: 3
  num_rbf: 25
  cutoff: 5.0
  max_num_neighbors: 100
  reduce_op: mean
dataset:
  type: pubchemqc
  hdf5_path: data/processed/pubchemqc/pubchemqc_s10_packed.h5
  manifest_path: data/processed/pubchemqc/pubchemqc_s10_packed_manifest.csv
  exclude_keys_path: data/processed/pubchemqc/pretrain_exclusions_screened.csv
  local_copy: true
  report_subset_metrics: false
  split_seed: 17
  train_fraction: 0.98
  val_fraction: 0.01
targets:
  columns:
  - S1_eV
  - S2_eV
  - S3_eV
  - S4_eV
  - S5_eV
loss:
  type: qm9gwbse
  energy_weight: 1.0
  oscillator_weight: 1.0
  gap_weight: 0.1
  ordering_weight: 0.01
training:
  device: cuda
  seed: 17
  epochs: 20
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.001
  max_grad_norm: 1.0
  skip_nonfinite_batches: true
  dataloader:
    num_workers: 14
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  scheduler:
    type: warmup_cosine
    warmup_epochs: 1
    start_factor: 0.0033333333333333335
    min_lr: 1.0e-05
  checkpoint_path: checkpoints/pubchemqc_s5_pretrain_e20.pt
  metrics_csv_path: runs/pubchemqc_s5_pretrain_e20.metrics.csv
  summary_json_path: runs/pubchemqc_s5_pretrain_e20.summary.json
  checkpoint_metric: val_energy_eV_mae
  log_batch_loss_above: 1.0
wandb:
  enabled: true
  entity: shayangohar2007-fresno-state
  project: gnn-excited
  name: pubchemqc_s5_pretrain_e20
  group: pubchemqc-transfer
  tags:
  - PubChemQC
  - S1-S5
  - ViSNet
  - TD-DFT
  - leakage-safe
  - pretrain
