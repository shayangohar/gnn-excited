# TASK-310 (wave F, bet B follow-up, KNOW-307): template for few-shot OE62H GW-label fine-tuning.
# scripts/build_oe62h_shots.py fills checkpoint/metrics/summary paths, wandb name, shots.packed_path and
# post_inference.out_csv per fold and shot count (and drops `shots` for the k=0 control).
# Starts from the trained heavy-aux heads model (uma_qm9gwbse_richind_he_heads_s17), keeps its QM9GWBSE
# and heavy TD-DFT aux training, and adds one OE62H shots batch per GW step for a fixed 2-epoch schedule.
model:
  checkpoint_path: checkpoints/uma/checkpoints/uma-s-1p2p1.pt
  head_hidden: 256
  readout: rich
  readout_layers: 1
  lmax: 2
dataset:
  packed_path: data/processed/qm9gwbse/qm9gwbse_packed.npz
targets:
  columns:
  - S1_eV
  - log1p_S1_f
  - S2_eV
  - log1p_S2_f
  - S3_eV
  - log1p_S3_f
  - S4_eV
  - log1p_S4_f
  - S5_eV
  - log1p_S5_f
loss:
  type: qm9gwbse
  energy_weight: 1.0
  oscillator_weight: 1.0
  gap_weight: 0.1
  ordering_weight: 0.01
training:
  device: cuda
  seed: 17
  init_checkpoint: checkpoints/uma_qm9gwbse_richind_he_heads_s17.pt
  epochs: 2
  batch_size: 64
  backbone_lr: 0.00005
  head_lr: 0.0002
  backbone_weight_decay: 0.0
  head_weight_decay: 0.001
  max_grad_norm: 1.0
  bf16: false
  mole_split_patch: true
  num_workers: 8
  max_hours: 3
  scheduler:
    warmup_epochs: 0.2
    start_factor: 0.1
    min_factor: 0.01
  checkpoint_path: checkpoints/fewshot_oe62h/NAME.pt
  metrics_csv_path: runs/fewshot_oe62h/NAME.metrics.csv
  summary_json_path: runs/fewshot_oe62h/NAME.summary.json
  checkpoint_metric: last_epoch
  ema_decay: 0.999
  layer_lr_decay: 0.85
wandb:
  enabled: true
  entity: shayangohar2007-fresno-state
  project: gnn-excited
  name: fewshot_oe62h_NAME
  group: uma-wave-f-fewshot
  tags:
  - QM9GWBSE
  - OE62H
  - few-shot
  - multi-fidelity
  - TASK-310
aux:
  packed_path: data/processed/pubchemqc_aux/heavy.npz
  columns: [S1_eV, S2_eV, S3_eV, S4_eV, S5_eV]
  mode: heads
  weight: 1.0
  batch_size: 32
shots:
  packed_path: SHOTS
  columns: [S1_eV, S2_eV, S3_eV, S4_eV, S5_eV]
  weight: 1.0
  batch_size: 8
post_inference:
  pool_path: data/processed/external_testsets/pool.npz
  out_csv: runs/fewshot_oe62h/ext_NAME.csv
