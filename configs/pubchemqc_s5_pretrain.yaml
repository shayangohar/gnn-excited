# TASK-217: PubChemQC TD-DFT (B3LYP/6-31G*) S1-S5 pretraining at scale.
# Energy-only head matches the QM9GWBSE energy readout so the finetune can
# load encoder + energy head (transfer mode encoder_energy_finetune).
# QM9GWBSE val/test identities are excluded (scripts/pack_pubchemqc.py).
model:
  type: visnet
  hidden_channels: 216
  num_layers: 3
  num_rbf: 25
  cutoff: 5.0
  max_num_neighbors: 100
  reduce_op: mean

dataset:
  type: pubchemqc
  hdf5_path: data/processed/pubchemqc/pubchemqc_s10_packed.h5
  manifest_path: data/processed/pubchemqc/pubchemqc_s10_packed_manifest.csv
  exclude_keys_path: data/processed/pubchemqc/qm9gwbse_holdout_exclusions.csv
  local_copy: true
  report_subset_metrics: false
  split_seed: 17
  train_fraction: 0.98
  val_fraction: 0.01

targets:
  columns:
    - S1_eV
    - S2_eV
    - S3_eV
    - S4_eV
    - S5_eV

loss:
  type: qm9gwbse
  energy_weight: 1.0
  oscillator_weight: 1.0
  gap_weight: 0.1
  ordering_weight: 0.01

training:
  device: cuda
  seed: 17
  # ~3.1M train x 10 = ~31M samples, about 2x the QCDGE donor's 16.7M. The
  # OMol25 (8.1M) and QM-symex (1.3M) donors both peaked at their last epoch.
  epochs: 10
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.001
  max_grad_norm: 1.0
  skip_nonfinite_batches: true
  dataloader:
    num_workers: 14
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  scheduler:
    type: warmup_cosine
    warmup_epochs: 1
    start_factor: 0.0033333333333333335
    min_lr: 0.00001
  checkpoint_path: checkpoints/pubchemqc_s5_pretrain.pt
  metrics_csv_path: runs/pubchemqc_s5_pretrain.metrics.csv
  summary_json_path: runs/pubchemqc_s5_pretrain.summary.json

wandb:
  enabled: true
  entity: shayangohar2007-fresno-state
  project: gnn-excited
  name: pubchemqc_s5_pretrain
  group: pubchemqc-transfer
  tags:
    - PubChemQC
    - S1-S5
    - ViSNet
    - TD-DFT
    - leakage-safe
    - pretrain
