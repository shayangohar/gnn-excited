model:
  type: visnet
  hidden_channels: 216
  num_layers: 3
  num_rbf: 25
  cutoff: 5.0
  max_num_neighbors: 100
  reduce_op: mean

dataset:
  hdf5_path: data/final_all.hdf5
  manifest_path: data/processed/final_all_manifest_s5_dedup.csv
  split_path: data/processed/qcdge_audit/splits.csv
  split_column: random_split
  exclude_keys_path: data/processed/qm9gwbse/qcdge_pretrain_exclusions.csv
  local_copy: false
  report_subset_metrics: true
  split_seed: 17

targets:
  columns:
    - S1_eV
    - log1p_S1_f
    - S2_eV
    - log1p_S2_f
    - S3_eV
    - log1p_S3_f
    - S4_eV
    - log1p_S4_f
    - S5_eV
    - log1p_S5_f

loss:
  type: qm9gwbse
  energy_weight: 1.0
  oscillator_weight: 1.0
  gap_weight: 0.1
  ordering_weight: 0.01

evaluation:
  checkpoint_path: checkpoints/visnet_faithful_qcdge_pretrain.pt
  predictions_csv_path: runs/visnet_faithful_qcdge_repair_eval.predictions.csv

training:
  device: cuda
  seed: 17
  epochs: 0
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.001
  max_grad_norm: 1.0
  dataloader:
    num_workers: 0
    pin_memory: true
  checkpoint_path: checkpoints/visnet_faithful_qcdge_pretrain.pt
  metrics_csv_path: runs/visnet_faithful_qcdge_repair_eval.metrics.csv
  summary_json_path: runs/visnet_faithful_qcdge_repair_eval.summary.json

wandb:
  enabled: true
  entity: shayangohar2007-fresno-state
  project: gnn-excited
  name: visnet_faithful_qcdge_repair_eval
  group: qcdge-qm9gwbse-controls
  job_type: evaluation
  tags:
    - QCDGE-full
    - S1-S5
    - ViSNet
    - leakage-safe
    - checkpoint-evaluation
    - single-worker-hdf5
