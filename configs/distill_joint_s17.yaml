# TASK-262 C2: distillation v2, seed 17. One stage on teacher pseudo-labels plus QM9GWBSE train true
# labels (x2), selected on true QM9GWBSE val energy; init = wave B stage A student.
model:
  type: visnet
  hidden_channels: 216
  num_layers: 3
  num_rbf: 25
  cutoff: 5.0
  max_num_neighbors: 100
  reduce_op: mean
dataset:
  type: pubchemqc
  hdf5_path: data/processed/distill/joint_pseudo_true.h5
  manifest_path: data/processed/distill/joint_pseudo_true_manifest.csv
  local_copy: true
  report_subset_metrics: false
  split_seed: 17
  train_fraction: 0.98
  val_fraction: 0.01
  split_path: data/processed/distill/joint_pseudo_true_split.csv
  split_column: split
targets:
  columns:
  - S1_eV
  - S2_eV
  - S3_eV
  - S4_eV
  - S5_eV
loss:
  type: qm9gwbse
  energy_weight: 1.0
  oscillator_weight: 1.0
  gap_weight: 0.1
  ordering_weight: 0.01
training:
  device: cuda
  seed: 17
  epochs: 8
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.001
  max_grad_norm: 1.0
  skip_nonfinite_batches: true
  dataloader:
    num_workers: 14
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  scheduler:
    type: warmup_cosine
    warmup_epochs: 1
    start_factor: 0.0033333333333333335
    min_lr: 1.0e-05
  checkpoint_path: checkpoints/distill_joint_s17.pt
  metrics_csv_path: runs/distill_joint_s17.metrics.csv
  summary_json_path: runs/distill_joint_s17.summary.json
  checkpoint_metric: val_energy_eV_mae
  log_batch_loss_above: 1.0
wandb:
  enabled: true
  entity: shayangohar2007-fresno-state
  project: gnn-excited
  name: distill_joint_s17
  group: distillation-v2
  tags:
  - PubChemQC
  - S1-S5
  - ViSNet
  - TD-DFT
  - leakage-safe
  - pretrain
transfer:
  checkpoint_path: checkpoints/distill_student_pretrain.pt
  mode: full_finetune
