model:
  type: visnet
  hidden_channels: 216
  num_layers: 3
  num_rbf: 25
  cutoff: 5.0
  max_num_neighbors: 100
  reduce_op: mean

dataset:
  type: qm9gwbse
  hdf5_path: data/processed/qm9gwbse/qm9gwbse.h5
  manifest_path: data/processed/qm9gwbse/manifest.csv
  split_path: data/processed/qm9gwbse/splits.csv
  split_column: random_split
  local_copy: true
  split_seed: 17

targets:
  columns:
    - S1_eV
    - log1p_S1_f
    - S2_eV
    - log1p_S2_f
    - S3_eV
    - log1p_S3_f
    - S4_eV
    - log1p_S4_f
    - S5_eV
    - log1p_S5_f

loss:
  type: qm9gwbse
  energy_weight: 1.0
  oscillator_weight: 1.0
  gap_weight: 0.1
  ordering_weight: 0.01

training:
  device: cuda
  seed: 17
  epochs: 0
  batch_size: 32
  learning_rate: 0.0003
  dataloader:
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  checkpoint_path: checkpoints/visnet_qm9gwbse_full_finetune.pt
  metrics_csv_path: runs/visnet_qm9gwbse_full_finetune_eval.metrics.csv
  summary_json_path: runs/visnet_qm9gwbse_full_finetune_eval.summary.json

evaluation:
  checkpoint_path: checkpoints/visnet_qm9gwbse_full_finetune.pt
  predictions_csv_path: runs/visnet_qm9gwbse_full_finetune.predictions.csv

wandb:
  enabled: false
